services:
  signet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signet-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - WEB_APP_URL=${WEB_APP_URL:-http://localhost:8080}
      - STORAGE_DIR=/app/storage
    volumes:
      - signet_storage:/app/storage

volumes:
  signet_storage:
    driver: local
